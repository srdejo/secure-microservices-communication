plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.10.0'
	id 'jacoco'
}

jacoco {
	toolVersion = "0.8.14"
}

group = 'com.linktic'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '25'
}

ext {
	set('springCloudVersion', "2025.1.0")
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'io.github.openfeign:feign-hc5'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
	
	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	
	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/dto/**',
				'**/mapper/**',
				'**/config/**',
				'**/exception/**',
				'**/*Application*',
				'**/infrastructure/adapter/in/rest/api/**',
				'**/infrastructure/adapter/out/external/dto/**'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn 'compileJava', 'processResources', 'openApiGenerate'
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/dto/**',
				'**/mapper/**',
				'**/config/**',
				'**/exception/**',
				'**/*Application*',
				'**/infrastructure/adapter/in/rest/api/**',
				'**/infrastructure/adapter/out/external/dto/**'
			])
		}))
	}
	violationRules {
		rule {
			limit {
				minimum = 0.80
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "${projectDir}/src/main/resources/api-spec/inventory-api.yaml"
    outputDir = "${buildDir}/generated"
    apiPackage = "com.linktic.inventoryservice.infrastructure.adapter.in.rest.api"
    modelPackage = "com.linktic.inventoryservice.infrastructure.adapter.in.rest.dto"
    modelNameSuffix = "DTO"
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        openApiNullable: "false",
        skipDefaultInterface: "true",
        useTags: "true"
    ]
}

sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/src/main/java"
        }
    }
}

tasks.compileJava.dependsOn tasks.openApiGenerate
